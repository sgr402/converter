<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単位変換</title>
<link rel="manifest" href="converter.webmanifest">
<link rel="apple-touch-icon" href="icons/converter-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="単位変換">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#bfd3c8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#123029">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --enamel: #bfd3c8;
    --ink: #12302a;
    --muted: #3a564e;
    --hairline: #7f9c91;
    --needle: #d81e1e;
    --error: #9c1218;
    --plate-text: #e6f0ea;

    --rule-x: clamp(120px, 24vw, 340px);
    --display: clamp(84px, 12vw, 168px);
    --latin: "Barlow Condensed", "Arial Narrow", "Zen Kaku Gothic New", sans-serif;
    --japanese: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --enamel: #123029;
      --ink: #e4efe8;
      --muted: #a9c3b7;
      --hairline: #4c6f64;
      --needle: #ff5040;
      --error: #ffb4a8;
      --plate-text: #123029;
    }
  }
  @media (max-width: 720px) {
    :root {
      --rule-x: 16px;
      --display: 84px;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--enamel);
    color: var(--ink);
    font-family: var(--japanese);
    font-weight: 500;
    line-height: 1.6;
  }

  .needle {
    position: fixed;
    top: 0;
    bottom: 0;
    left: var(--rule-x);
    width: 2px;
    background: var(--needle);
    z-index: 2;
    pointer-events: none;
  }

  main {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
  }
  .upper, .lower {
    min-width: 0;
    padding-left: calc(var(--rule-x) + 20px);
    padding-right: 16px;
  }
  .upper { align-self: end; padding-top: 32px; padding-bottom: 10px; }
  .lower { align-self: start; padding-top: 14px; padding-bottom: 32px; }

  h1 {
    position: absolute;
    top: 40px;
    left: 0;
    width: calc(var(--rule-x) - 24px);
    margin: 0;
    display: flex;
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.3em;
    writing-mode: vertical-rl;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .plates {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .plate {
    position: relative;
    min-height: 48px;
    border-radius: 3px;
    background: var(--ink);
    color: var(--plate-text);
  }
  .plate:has(select:focus-visible), .swap:focus-visible {
    outline: 3px solid var(--needle);
    outline-offset: 2px;
  }
  .plate-face {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 0 40px 0 14px;
    font-family: var(--latin);
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .swap {
    flex: none;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  .plate::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 18px;
    width: 8px;
    height: 8px;
    margin-top: -6px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    pointer-events: none;
  }
  select {
    /* 閉じた状態は .plate-face に単位だけを見せ、一覧には名称つきの選択肢を出す */
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    font-size: 1rem;
    cursor: pointer;
  }
  select option, select optgroup {
    background: var(--ink);
    color: var(--plate-text);
    font-family: var(--japanese);
    font-size: 1rem;
  }

  .hint {
    display: block;
    color: var(--muted);
    font-size: 0.9375rem;
  }

  .number {
    --fit: calc((100vw - var(--rule-x) - 36px) / ((var(--chars, 3) + 1) * 0.46));
    display: flex;
    align-items: baseline;
    gap: 0.1em;
    font-family: var(--latin);
    font-size: max(32px, min(var(--display), var(--fit)));
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
  }
  .unit {
    flex: none;
    font-size: 0.4em;
    font-weight: 500;
  }

  .sizer {
    display: inline-grid;
    grid-template-columns: minmax(0, auto);
    min-width: 0;
    overflow: hidden;
    box-shadow: 0 2px 0 var(--hairline);
  }
  .sizer:focus-within { box-shadow: 0 4px 0 var(--ink); }
  .sizer:has(input[aria-invalid="true"]) { box-shadow: 0 4px 0 var(--error); }
  .sizer > * {
    grid-area: 1 / 1;
    min-width: 0;
    font: inherit;
    font-variant-numeric: inherit;
    line-height: inherit;
  }
  .sizer span {
    visibility: hidden;
    white-space: pre;
    padding-right: 0.06em;
  }
  .sizer input {
    width: 0;
    min-width: 100%;
    padding: 0;
    border: 0;
    outline: 0;
    background: none;
    color: inherit;
    caret-color: var(--needle);
  }
  input::placeholder { color: var(--hairline); opacity: 1; }

  .error {
    min-height: 1.6em;
    margin: 8px 0 0;
    color: var(--error);
    font-size: 0.9375rem;
  }

  .tape {
    display: block;
    width: 100%;
    height: 136px;
  }

  output { overflow-wrap: anywhere; }
  output.empty #result { color: var(--hairline); font-weight: 500; }
  .rule-note {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 0.9375rem;
    max-width: 60ch;
  }
  .rule-note a { color: inherit; }

  @media (max-width: 720px) {
    h1 {
      position: static;
      display: block;
      width: auto;
      margin-bottom: 20px;
      font-size: 1.25rem;
      letter-spacing: 0.2em;
      writing-mode: horizontal-tb;
    }
    .plates { margin-bottom: 20px; }
    .tape { height: 116px; }
  }
</style>
</head>
<body>
<div class="needle" id="needle" aria-hidden="true"></div>

<main>
  <div class="upper">
    <h1>単位変換</h1>

    <div class="plates">
      <div class="plate">
        <label class="visually-hidden" for="from">変換元の単位</label>
        <span class="plate-face" id="from-face" aria-hidden="true"></span>
        <select id="from"></select>
      </div>
      <button class="swap" id="swap" type="button" aria-label="変換元と変換先を入れ替える">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M3 9h19M17 4l5 5-5 5M23 17H4M9 12l-5 5 5 5"/></svg>
      </button>
      <div class="plate">
        <label class="visually-hidden" for="to">変換先の単位</label>
        <span class="plate-face" id="to-face" aria-hidden="true"></span>
        <select id="to"></select>
      </div>
    </div>

    <label class="hint" for="value">数値を入力</label>
    <div class="number" id="input-line">
      <div class="sizer">
        <span id="mirror" aria-hidden="true">0</span>
        <input id="value" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="0" aria-describedby="error" autofocus>
      </div>
      <span class="unit" id="from-unit"></span>
    </div>
    <p class="error" id="error" role="alert"></p>
  </div>

  <canvas class="tape" id="tape" aria-hidden="true"></canvas>

  <div class="lower">
    <output class="number" id="result-line" for="from to value" aria-label="変換結果">
      <span id="result">—</span>
      <span class="unit" id="to-unit"></span>
    </output>
    <p class="rule-note"><span id="note"></span> <a id="credit" href="https://www.exchangerate-api.com" hidden>Rates By Exchange Rate API</a></p>
  </div>
</main>

<script>
  const KG_PER_LB = 0.45359237; // 国際ポンドの定義値
  const CM_PER_INCH = 2.54;     // 国際インチの定義値

  const LB_RULE = "1 lb = 0.45359237 kg";
  const INCH_RULE = "1 inch = 2.54 cm";

  const CURRENCY = "通貨";
  const RATES_URL = "https://open.er-api.com/v6/latest/USD";
  const RATES_KEY = "converter.rates.v1";
  const PAIR_KEY = "converter.pair.v1";

  // localStorage が使えない環境でも変換は動かす
  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  let rates = load(RATES_KEY); // { values: {通貨: 1米ドルあたりの額}, updated, next }（UNIX秒）
  let ratesState = "idle";     // idle | loading | failed

  // toBase / fromBase は各グループの基準単位（kg・cm・℃・米ドル）との換算
  const linear = (perUnit) => ({ toBase: (x) => x * perUnit, fromBase: (x) => x / perUnit });
  const money = (code) => ({
    label: code,
    toBase: (x) => x / rates.values[code],
    fromBase: (x) => x * rates.values[code],
  });

  const UNITS = {
    kg:   { group: "重さ", name: "キログラム", label: "kg",   rule: LB_RULE,   ...linear(1) },
    lb:   { group: "重さ", name: "ポンド",     label: "lb",   rule: LB_RULE,   ...linear(KG_PER_LB) },
    cm:   { group: "長さ", name: "センチ",     label: "cm",   rule: INCH_RULE, ...linear(1) },
    inch: { group: "長さ", name: "インチ",     label: "inch", rule: INCH_RULE, ...linear(CM_PER_INCH) },
    c:    { group: "温度", name: "摂氏", label: "℃", min: -273.15, rule: "℃ = (℉ − 32) × 5 ÷ 9",
            toBase: (x) => x, fromBase: (x) => x },
    f:    { group: "温度", name: "華氏", label: "℉", min: -459.67, rule: "℉ = ℃ × 9 ÷ 5 + 32",
            toBase: (x) => (x - 32) * 5 / 9, fromBase: (x) => x * 9 / 5 + 32 },
    VND:  { group: CURRENCY, name: "ベトナムドン", ...money("VND") },
    JPY:  { group: CURRENCY, name: "日本円",       ...money("JPY") },
    USD:  { group: CURRENCY, name: "米ドル",       ...money("USD") },
    CNY:  { group: CURRENCY, name: "人民元",       ...money("CNY") },
    TWD:  { group: CURRENCY, name: "台湾ドル",     ...money("TWD") },
    KRW:  { group: CURRENCY, name: "韓国ウォン",   ...money("KRW") },
  };
  const unitsIn = (group) => Object.keys(UNITS).filter((id) => UNITS[id].group === group);
  const GROUPS = [...new Set(Object.values(UNITS).map((unit) => unit.group))];

  const fromEl = document.getElementById("from");
  const toEl = document.getElementById("to");
  const fromFaceEl = document.getElementById("from-face");
  const toFaceEl = document.getElementById("to-face");
  const creditEl = document.getElementById("credit");
  const valueEl = document.getElementById("value");
  const mirrorEl = document.getElementById("mirror");
  const inputLineEl = document.getElementById("input-line");
  const resultLineEl = document.getElementById("result-line");
  const fromUnitEl = document.getElementById("from-unit");
  const toUnitEl = document.getElementById("to-unit");
  const resultEl = document.getElementById("result");
  const errorEl = document.getElementById("error");
  const noteEl = document.getElementById("note");

  // ---- 巻尺の描画 ----
  // 上辺が入力側の単位、下辺が結果側の単位。赤い基準線の位置が現在の値を指す。
  const tape = (() => {
    const canvas = document.getElementById("tape");
    const needle = document.getElementById("needle");
    const ctx = canvas.getContext("2d");
    const YELLOW = "#f7c600";
    const INK = "#15231f";
    const MAJOR_PX = 110;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let width = 0, height = 0, originX = 0;
    let conversion = null;
    const target = { center: 0, logPx: Math.log(MAJOR_PX / 10) };
    const state = { ...target };
    let frame = 0, lastTime = 0, started = false;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      width = rect.width;
      height = rect.height;
      originX = needle.getBoundingClientRect().left + 1;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function labelFor(v, step) {
      if (Math.abs(v) < step / 2) return "0";
      if (Math.abs(v) >= 1e9) return v.toExponential(2);
      const digits = Math.max(0, Math.ceil(-Math.log10(step)));
      return v.toLocaleString("ja-JP", { maximumFractionDigits: digits });
    }

    // 主目盛りの間隔を 1・2・5 × 10^n から選ぶ
    function chooseStep(pxPerUnit, minPx) {
      const raw = minPx / pxPerUnit;
      const pow = 10 ** Math.floor(Math.log10(raw));
      for (const [m, divisions] of [[1, 10], [2, 4], [5, 5]]) {
        if (m * pow >= raw) return { step: m * pow, divisions };
      }
      return { step: 10 * pow, divisions: 10 };
    }

    function drawScale(center, pxPerUnit, tapeLeft, isTop, unit) {
      const fontSize = height < 130 ? 20 : 24;
      ctx.font = `600 ${fontSize}px "Barlow Condensed", "Arial Narrow", sans-serif`;
      ctx.fillStyle = INK;
      ctx.textBaseline = isTop ? "top" : "bottom";

      const sample = ctx.measureText(labelFor(center, 72 / pxPerUnit)).width;
      const { step, divisions } = chooseStep(pxPerUnit, Math.max(72, sample + 28));
      const minor = step / divisions;
      const first = Math.ceil((center - originX / pxPerUnit) / minor);
      const last = Math.floor((center + (width - originX) / pxPerUnit) / minor);
      if (last - first > 2000) return;

      const tagWidth = ctx.measureText(unit).width + 24;
      const labelY = isTop ? 18 : height - 18;

      for (let i = first; i <= last; i++) {
        const x = originX + (i * minor - center) * pxPerUnit;
        if (x < tapeLeft) continue;
        const isMajor = i % divisions === 0;
        const isHalf = !isMajor && divisions === 10 && i % 5 === 0;
        const length = isMajor ? 42 : isHalf ? 16 : 10;
        ctx.fillRect(x - 0.75, isTop ? 0 : height - length, isMajor ? 2 : 1.5, length);
        if (isMajor) {
          const label = labelFor(i * minor, step);
          if (x + 6 + ctx.measureText(label).width < width - tagWidth) {
            ctx.fillText(label, x + 6, labelY);
          }
        }
      }

      // 目盛りの単位を右端に固定表示
      ctx.fillStyle = YELLOW;
      ctx.fillRect(width - tagWidth, isTop ? 0 : height - fontSize - 26, tagWidth, fontSize + 26);
      ctx.fillStyle = INK;
      ctx.fillText(unit, width - tagWidth + 10, labelY);
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      if (!conversion) return;
      const px = Math.exp(state.logPx);
      const tapeLeft = originX + (conversion.min - state.center) * px;

      ctx.fillStyle = YELLOW;
      ctx.fillRect(Math.max(0, tapeLeft), 0, width, height);
      if (tapeLeft >= 0) {
        ctx.fillStyle = INK;
        ctx.fillRect(tapeLeft - 6, 0, 6, height);
      }

      const b = conversion.convert(0);
      const a = conversion.convert(1) - b;
      drawScale(state.center, px, tapeLeft, true, conversion.from);
      drawScale(a * state.center + b, px / a, tapeLeft, false, conversion.to);
    }

    function step(now) {
      const k = 1 - Math.exp(-Math.min(now - lastTime, 50) / 110);
      lastTime = now;
      state.center += (target.center - state.center) * k;
      state.logPx += (target.logPx - state.logPx) * k;
      const px = Math.exp(state.logPx);
      const settled = Math.abs(target.center - state.center) * px < 0.3
        && Math.abs(target.logPx - state.logPx) < 0.002;
      if (settled) {
        state.center = target.center;
        state.logPx = target.logPx;
        frame = 0;
      } else {
        frame = requestAnimationFrame(step);
      }
      draw();
    }

    function animate() {
      if (reduceMotion) {
        Object.assign(state, target);
        draw();
      } else if (!frame) {
        lastTime = performance.now();
        frame = requestAnimationFrame(step);
      }
    }

    function moveTo(nextConversion, x) {
      conversion = nextConversion;
      target.center = x;
      const magnitude = x === 0 ? 10 : 10 ** Math.floor(Math.log10(Math.abs(x)));
      target.logPx = Math.log(MAJOR_PX / magnitude);
      if (!started) {
        started = true;
        // 読み込み時に一度だけ、テープを右から引き出す
        state.center = target.center - (width - originX) / Math.exp(target.logPx);
        state.logPx = target.logPx;
      }
      animate();
    }

    resize();
    window.addEventListener("resize", () => { resize(); draw(); });
    if (document.fonts) document.fonts.ready.then(draw);

    // 入力エラー中は位置を保つ。切り替え先の目盛りの範囲外なら下限へ戻す
    function hold(nextConversion) {
      conversion = nextConversion;
      target.center = Math.max(target.center, nextConversion.min);
      animate();
    }

    // レート未取得の間は目盛りを出さない
    function clear() {
      conversion = null;
      draw();
    }

    return { moveTo, hold, clear };
  })();

  // ---- 変換 ----
  // 全角の数字・記号でも入力できるよう半角にそろえる
  function normalize(text) {
    return text
      .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[．。]/g, ".")
      .replace(/[－ー−]/g, "-")
      .replace(/＋/g, "+")
      .replace(/[,，\s　]/g, "");
  }

  function format(x) {
    const options = Math.abs(x) >= 1
      ? { maximumFractionDigits: 4 }
      : { maximumSignificantDigits: 6 };
    return x.toLocaleString("ja-JP", options);
  }

  // 通貨は実用的な桁に丸める。100以上の円・ウォン・ドンは小数を出さない
  function formatMoney(x, code) {
    const abs = Math.abs(x);
    if (abs !== 0 && abs < 1) return x.toLocaleString("ja-JP", { maximumSignificantDigits: 3 });
    const noDecimals = abs >= 100 && ["VND", "JPY", "KRW"].includes(code);
    return x.toLocaleString("ja-JP", { maximumFractionDigits: noDecimals ? 0 : 2 });
  }

  function ratesNote(fromId, toId) {
    const perOne = UNITS[toId].fromBase(UNITS[fromId].toBase(1));
    const when = new Date(rates.updated * 1000).toLocaleString("ja-JP", {
      month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
    });
    const pair = `1 ${fromId} = ${perOne.toLocaleString("ja-JP", { maximumSignificantDigits: 6 })} ${toId}`;
    const stale = ratesState === "failed" ? "・最新のレートを取得できませんでした" : "";
    return `${pair}（${when}時点${stale}）`;
  }

  function makeConversion(fromId, toId) {
    const from = UNITS[fromId], to = UNITS[toId];
    const isMoney = from.group === CURRENCY;
    return {
      from: from.label,
      to: to.label,
      min: from.min ?? 0,
      note: isMoney ? ratesNote(fromId, toId) : from.group === "温度" ? to.rule : from.rule,
      convert: (x) => to.fromBase(from.toBase(x)),
      format: isMoney ? (x) => formatMoney(x, toId) : format,
    };
  }

  function showResult(text, unit, error) {
    resultEl.textContent = text;
    toUnitEl.textContent = unit;
    errorEl.textContent = error;
    valueEl.setAttribute("aria-invalid", error ? "true" : "false");
    resultLineEl.style.setProperty("--chars", text.length + unit.length * 0.4);
    resultLineEl.classList.toggle("empty", unit === "");
  }

  function update() {
    const from = UNITS[fromEl.value];
    const isMoney = from.group === CURRENCY;
    fromUnitEl.textContent = from.label;
    fromFaceEl.textContent = from.label;
    toFaceEl.textContent = UNITS[toEl.value].label;
    creditEl.hidden = !isMoney;
    // iPhone のテンキーにはマイナスがないため、負の値を入れる温度だけ通常キーボードにする
    valueEl.inputMode = (from.min ?? 0) < 0 ? "text" : "decimal";
    mirrorEl.textContent = valueEl.value || "0";
    inputLineEl.style.setProperty("--chars", (valueEl.value.length || 1) + from.label.length * 0.4);

    if (isMoney && !rates) {
      tape.clear();
      noteEl.textContent = ratesState === "loading" ? "為替レートを取得中です" : "";
      return showResult("—", "", ratesState === "failed"
        ? "為替レートを取得できませんでした。通信環境を確認してください" : "");
    }

    const conversion = makeConversion(fromEl.value, toEl.value);
    noteEl.textContent = conversion.note;

    const text = normalize(valueEl.value);
    if (text === "") {
      tape.moveTo(conversion, 0);
      return showResult("—", "", "");
    }

    if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(text)) {
      tape.hold(conversion);
      return showResult("—", "", "数値を入力してください");
    }

    const x = Number(text);
    if (!Number.isFinite(x)) {
      tape.hold(conversion);
      return showResult("—", "", "数値が大きすぎます");
    }
    if (x < conversion.min) {
      const message = conversion.min === 0
        ? "0以上の数値を入力してください"
        : `絶対零度（${conversion.min}${conversion.from}）以上の数値を入力してください`;
      tape.hold(conversion);
      return showResult("—", "", message);
    }

    tape.moveTo(conversion, x);
    showResult(conversion.format(conversion.convert(x)), conversion.to, "");
  }

  // ---- 単位の選択 ----
  function option(id) {
    return new Option(`${UNITS[id].label}　${UNITS[id].name}`, id);
  }

  for (const group of GROUPS) {
    const optgroup = document.createElement("optgroup");
    optgroup.label = group;
    optgroup.append(...unitsIn(group).map(option));
    fromEl.append(optgroup);
  }

  let currentFrom = "kg";
  let currentTo = "lb";

  function applyPair(fromId, toId) {
    currentFrom = fromId;
    currentTo = toId;
    fromEl.value = fromId;
    toEl.replaceChildren(...unitsIn(UNITS[fromId].group).map(option));
    toEl.value = toId;
    save(PAIR_KEY, { from: fromId, to: toId });
    update();
  }

  fromEl.addEventListener("change", () => {
    const next = fromEl.value;
    if (UNITS[next].group !== UNITS[currentTo].group) {
      applyPair(next, unitsIn(UNITS[next].group).find((id) => id !== next));
    } else {
      applyPair(next, next === currentTo ? currentFrom : currentTo);
    }
  });
  toEl.addEventListener("change", () => {
    const next = toEl.value;
    applyPair(next === currentFrom ? currentTo : currentFrom, next);
  });
  document.getElementById("swap").addEventListener("click", () => applyPair(currentTo, currentFrom));
  valueEl.addEventListener("input", update);

  // ---- 為替レートの取得 ----
  // 無料データの更新は1日1回。次回更新の時刻を過ぎるまでは保存済みのレートを使う
  async function refreshRates() {
    if (ratesState === "loading" || (rates && Date.now() / 1000 < rates.next)) return;
    ratesState = "loading";
    update();
    try {
      const response = await fetch(RATES_URL);
      const data = await response.json();
      const complete = unitsIn(CURRENCY).every((code) => data.rates?.[code] > 0);
      if (data.result !== "success" || !complete) throw new Error("invalid rates");
      rates = { values: data.rates, updated: data.time_last_update_unix, next: data.time_next_update_unix };
      save(RATES_KEY, rates);
      ratesState = "idle";
    } catch {
      ratesState = "failed";
    }
    update();
  }

  // 前回の組み合わせで開く
  const savedPair = load(PAIR_KEY);
  const validPair = savedPair && UNITS[savedPair.from] && UNITS[savedPair.to]
    && savedPair.from !== savedPair.to
    && UNITS[savedPair.from].group === UNITS[savedPair.to].group;
  applyPair(validPair ? savedPair.from : "kg", validPair ? savedPair.to : "lb");

  refreshRates();
  // ホーム画面のアプリは開いたままになりやすいので、戻ってきた時にも確認する
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshRates();
  });
</script>
</body>
</html>
